function canvasFit() {
  const w = endRoom.clientWidth, h = endRoom.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return { ctx, w, h, fy: h - endDeck.offsetHeight, fh: endDeck.offsetHeight };
}
// 落地的纸屑按「离中线多远、在地面第几成深」记下来，转屏、刷新后照样画回去
function drawLanded() {
  if (reduce || !cv.getContext) return;
  const { ctx, w, fy, fh } = canvasFit();
  landed.forEach(p => {
    ctx.save(); ctx.translate(w / 2 + p.dx, fy + p.d * fh); ctx.rotate(p.r); ctx.scale(1, p.flat);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
}
// 刷新回到拆开以后：直接摆好一地纸屑
function settle() {
  let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  landed = Array.from({ length: 44 }, () => ({ dx: (rnd() - .5) * Math.min(endRoom.clientWidth, 400), d: .06 + rnd() * .86,
    w: 4 + rnd() * 4, h: 8 + rnd() * 4, r: rnd() * 6.28, flat: .35 + rnd() * .35, c: CONF[Math.floor(rnd() * CONF.length)] }));
  drawLanded();
}
// spine：翻开贺卡时从书脊喷一捧（不再从天上落、地上已有的留着）
function confetti(box, spine) {
  if (reduce || !cv.getContext || (spine && raining)) return;
  const { ctx, w, h, fy, fh } = canvasFit();
  const ox = box.x + box.w / 2, oy = box.y + 48, ps = [];
  const add = (x, y, vx, vy) => ps.push({ x, y, vx, vy, w: 4 + Math.random() * 4, h: 8 + Math.random() * 4, r: Math.random() * 6.28,
    vr: (Math.random() - .5) * .3, ph: Math.random() * 6.28, cap: 2 + Math.random() * 1.6, c: CONF[Math.floor(Math.random() * CONF.length)],
    rest: Math.random() < .5 ? fy + 6 + Math.random() * (fh - 20) : Infinity });
  const keep = spine ? landed : [];
  if (spine) for (let i = 0; i < 80; i++) add(ox + (Math.random() - .5) * 16, oy + (Math.random() - .5) * 96, (Math.random() - .25) * 10, -3 - Math.random() * 6);
  else {
    for (let i = 0; i < 90; i++) add(ox + (Math.random() - .5) * 48, oy, (Math.random() - .5) * 8, -5 - Math.random() * 5);
    for (let i = 0; i < 70; i++) add(w / 2 + (Math.random() - .5) * Math.min(w, 400), -16 - Math.random() * h * .5, (Math.random() - .5), 1 + Math.random());
  }
  landed = keep.slice(); raining = true;
  const old = keep.length;
  const t0 = performance.now();
  let last = t0;
  (function frame(t) {
    const el = t - t0, a = el > 4200 ? Math.max(0, 1 - (el - 4200) / 1200) : 1, f = Math.min(3, Math.max(0, t - last) / 16.67);
    last = t;
    ctx.clearRect(0, 0, w, h);
    landed.slice(0, old).forEach(p => { ctx.save(); ctx.translate(w / 2 + p.dx, fy + p.d * fh); ctx.rotate(p.r); ctx.scale(1, p.flat); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    ps.forEach(p => {
      if (!p.down) {
        p.vy = Math.min(p.vy + .18 * f, p.cap); p.vx *= Math.pow(.985, f);
        p.x += (p.vx + Math.sin(t / 400 + p.ph) * .6) * f; p.y += p.vy * f; p.r += p.vr * f;
        // 往下落的过程中碰到自己的落点就躺平，不再动
        if (p.vy > 0 && p.y >= p.rest) {
          p.down = true; p.flat = .35 + Math.random() * .35;
          landed.push({ dx: p.x - w / 2, d: (p.y - fy) / fh, w: p.w, h: p.h, r: p.r, flat: p.flat, c: p.c });
        }
      }
      const s = p.down ? p.flat : Math.cos(t / 180 + p.ph);
      ctx.save(); ctx.globalAlpha = p.down ? 1 : a; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, s);
      ctx.fillStyle = !p.down && FOIL.has(p.c) && Math.abs(s) < .3 ? '#fff6dc' : p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (el < 5400) requestAnimationFrame(frame); else { raining = false; drawLanded(); }
  })(t0);
}

// 接着上次的进度：门票已撕、走过的展厅摆成揭晓后的样子，镜头直接停在上次的展厅
const unInstant = el => setTimeout(() => el.classList.remove('instant'), 5000);
function restore() {
  if (P.used) forfeit();
  labelNext();
  if (!P.torn) return false;
  let at = P.at;
  if (at === 3 && !WISH.room.isConnected) at = 'end';
  if (at !== 'end' && !(at >= 0 && at < LEVELS.length)) at = 0;
  const el = at === 'end' ? endRoom : LEVELS[at].room;
  ticket.classList.add('instant', 'torn');
  intro.classList.add('on');
  LEVELS.forEach((L, i) => {
    if (!L.room.isConnected || L.room === el || !P.lv[i].done) return;
    const q = s => L.room.querySelector(s), st = { L, room: L.room, btns: [...L.room.querySelectorAll('.btn')], lamps: [...L.room.querySelectorAll('.lamps i')],
      lampsEl: q('.lamps'), stamp: q('.stamp'), drule: q('.drule'), piece: q('.piece'), sv: P.lv[i], streak: P.lv[i].streak };
    L.room.classList.add('instant', 'ready');
    if (L === WISH) wishPrep(st);
    markDone(st, P.lv[i].by === 'docent');
  });
  cur = rooms.indexOf(el); setCam(cur);
  if (el === endRoom) {
    blessEnd();
    if (P.opened) {
      endRoom.classList.add('instant', 'open'); record(); present.disabled = true;
      if (P.read) { endRoom.classList.add('read'); requestAnimationFrame(() => { cardFx(false); if (P.up) nightRestore(); else autoUp(12000); }); }
      else setTimeout(readCard, 1200);
      settle(); unInstant(endRoom);
    }
    nearGift();
  } else {
    if (P.lv[at].done) el.classList.add('instant');
    prepare(at);
    if (S.done) unInstant(el);
  }
  buildRope(); lights(cur, true); el.classList.add('ready');
  hudSet();
  if (S && !S.done) arrive(S);
  return true;
}

// 专属链接：网址后面加 ?zk 或 ?dzc。门票上自己的名字烫金，结尾自己那一栏多一句话，观展记录写上名字
const WHO = (location.search.match(/[?&](zk|dzc)\b/i) || [])[1];
if (WHO) P.me = WHO.toUpperCase();
if (P.me === 'ZK' || P.me === 'DZC') {
  document.querySelectorAll(`[data-who="${P.me}"]`).forEach(e => e.classList.add('me'));
  endRoom.querySelectorAll('.who').forEach(w => {
    w.insertAdjacentHTML('beforeend', '<span class="wm">这一份是你的</span>');
    w.classList.toggle('me', w.querySelector('.wn').dataset.who === P.me);
  });
  endRoom.querySelector('.rtop span').textContent = `${P.me} 的观展记录`;
}

setW();
if (!restore()) requestAnimationFrame(() => setTimeout(() => intro.classList.add('on', 'lit'), 80));
hudSet();
addEventListener('resize', setW);
})();
</script>
