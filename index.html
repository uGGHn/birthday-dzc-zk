<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#260d10">
<title>DZC & ZK 生日特展</title>
<style>
:root{
  --wall:#3a1619;--wall-deep:#260d10;--floor:#1c0b0d;--void:#120607;
  --L:255,224,173;
  --brass:#c9a46a;--brass-ink:#8a6634;--card:#f2efe9;--ink:#2b1b1c;--ink-2:#7a6a66;
  --chalk:#f3e7d8;--chalk-2:rgba(243,231,216,.64);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --display:"Didot","Bodoni 72","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --W:100vw;--hud:48px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --floor-h:calc(160px + var(--sb));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--void);color:var(--chalk);font-family:var(--sans);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}

/* 镜头：dolly 推拉，track 平移，rope 是前景隔离带（移动得比展厅快，产生纵深） */
#app{position:fixed;inset:0;overflow:hidden;background:var(--void);touch-action:none;-webkit-touch-callout:none}
#dolly{position:absolute;inset:0;transform-origin:50% 56%;will-change:transform}
#track{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
#rope{position:absolute;left:0;top:calc(100% - var(--floor-h) - 40px);height:72px;pointer-events:none;will-change:transform}
#rope svg{position:absolute;top:0;filter:brightness(.32);transition:filter .6s .3s}
#rope svg.lit{filter:none}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 72% at 50% 44%,transparent 52%,rgba(0,0,0,.56) 100%)}

/* 展厅 */
.room{position:relative;flex:none;width:var(--W);height:100%;overflow:hidden;
  background:
    linear-gradient(to bottom,transparent calc(100% - var(--floor-h) - 120px),rgba(var(--L),.08) calc(100% - var(--floor-h) - 120px),rgba(var(--L),.08) calc(100% - var(--floor-h) - 119px),transparent calc(100% - var(--floor-h) - 119px)),
    linear-gradient(to bottom,var(--wall-deep) 0,var(--wall) 40%,#331317 calc(100% - var(--floor-h)),var(--floor) calc(100% - var(--floor-h)),#140708 100%)}
.room::before{content:"";position:absolute;top:0;left:0;width:16px;bottom:var(--floor-h);
  background:linear-gradient(to right,rgba(0,0,0,.28),rgba(var(--L),.06) 50%,rgba(0,0,0,.28))}

/* 灯：镜头停稳后才开，闪两下亮起 */
.beam{position:absolute;top:0;left:50%;width:384px;margin-left:-192px;bottom:var(--floor-h);opacity:0;
  background:conic-gradient(from 156deg at 50% 0,transparent 0deg,rgba(var(--L),.16) 12deg,rgba(var(--L),.16) 36deg,transparent 48deg);
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 64%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 64%,transparent 100%)}
.pool{position:absolute;left:50%;bottom:var(--floor-h);width:320px;height:256px;margin-left:-160px;opacity:0;
  background:radial-gradient(ellipse 50% 50% at 50% 80%,rgba(var(--L),.16),transparent 100%)}
.spill{position:absolute;left:50%;top:calc(100% - var(--floor-h));width:320px;height:64px;margin-left:-160px;opacity:0;
  background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(var(--L),.12),transparent 100%)}
.lamp{position:absolute;top:0;left:50%;width:16px;height:20px;margin-left:-8px;background:#160809;border-radius:0 0 4px 4px}
.lamp::after{content:"";position:absolute;left:4px;right:4px;bottom:-4px;height:4px;border-radius:50%;opacity:0;
  background:rgba(var(--L),.9);box-shadow:0 0 12px 4px rgba(var(--L),.48)}
.shade{position:absolute;inset:0;background:rgba(10,4,5,.8);pointer-events:none}
.room.lit .beam,.room.lit .pool,.room.lit .spill,.room.lit .lamp::after{animation:on 1s linear both}
.room.lit .shade{animation:off 1s linear both}
@keyframes on{0%{opacity:0}8%{opacity:.9}16%{opacity:.1}28%{opacity:1}36%{opacity:.4}48%,100%{opacity:1}}
@keyframes off{0%{opacity:1}8%{opacity:.2}16%{opacity:.9}28%{opacity:0}36%{opacity:.6}48%,100%{opacity:0}}

/* 展台和展签 */
.stage{position:absolute;left:0;right:0;top:calc(var(--hud) + var(--st));bottom:var(--floor-h);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.piece{display:flex;flex-direction:column;align-items:center;transition:opacity .24s,transform .24s}
.piece.swap{opacity:0;transform:translateY(8px)}
.plinth{flex:none;position:relative;width:208px;height:96px;
  background:linear-gradient(to bottom,#f4efe7 0,#f4efe7 8px,#ddd4c8 8px,#bdb2a4 100%)}
.plinth::after{content:"";position:absolute;left:-24px;right:-24px;top:calc(100% - 4px);height:16px;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,0,.56),transparent 100%)}
.plaque{width:184px;height:56px;padding:8px 12px;border-radius:4px;background:var(--card);color:var(--ink);
  display:grid;grid-template-columns:28px 1fr;column-gap:8px}
.plinth .plaque{position:absolute;left:12px;top:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.plaque.on-wall{flex:none;margin:16px 0 40px;box-shadow:0 4px 8px rgba(0,0,0,.32)}
.pn{font:20px/24px var(--display);color:var(--ink-2);transition:color .4s}
.pa{display:block;font:16px/20px var(--serif);white-space:nowrap}
.pb{display:block;margin-top:4px;font:12px/16px var(--sans);color:var(--ink-2);white-space:nowrap}
.room.clear .pn{color:var(--brass-ink)}

/* 拆解揭晓的引线 */
.co{position:absolute;white-space:nowrap;font:12px/16px var(--sans);letter-spacing:0;color:var(--brass);
  text-shadow:none;opacity:0;transition:opacity .4s 1s}
.co::before{content:"";position:absolute;top:8px;height:1px;background:var(--brass)}
.torn .co{opacity:1}

/* 展品 01：展柜，揭晓时玻璃罩升起，字下标出序号 */
.vit{position:relative;width:152px;height:136px;display:flex;align-items:center;justify-content:center}
.glass{position:absolute;inset:0;border:1px solid rgba(255,255,255,.3);border-bottom:0;
  background:linear-gradient(112deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.04) 30%,rgba(255,255,255,0) 56%,rgba(255,255,255,.06) 100%);
  transition:transform .8s var(--ease),opacity .8s}
.vbase{width:160px;height:8px;background:#1d1112}
.word{position:relative;font:40px/48px var(--serif);letter-spacing:4px;padding-left:4px;white-space:nowrap;
  color:var(--chalk);text-shadow:0 0 24px rgba(var(--L),.4)}
.ch{position:relative;display:inline-block}
.ch::after{content:attr(data-n);position:absolute;left:0;top:100%;width:40px;text-align:center;
  font:12px/16px var(--display);letter-spacing:0;color:var(--brass);text-shadow:none;opacity:0;transition:opacity .4s .8s}
.word .co{left:100%;top:16px;padding-left:40px}
.word .co::before{left:8px;width:24px}
.torn .glass{transform:translateY(-96px);opacity:.4}
.torn .ch::after{opacity:1}

/* 展品 02：挂画，揭晓时画往前浮出、画框往后上方退开，圈出筷子尖 */
.pic{position:relative;width:240px;height:184px}
.canvas{position:absolute;z-index:1;left:12px;top:12px;display:block;box-shadow:0 8px 16px rgba(0,0,0,.36);
  transition:transform .8s var(--ease),box-shadow .8s}
.ring{position:absolute;inset:0;border:12px solid #b08a4f;
  border-image:linear-gradient(135deg,#e6c98f 0,#a37b43 38%,#dcbb7d 62%,#8a6634 100%) 1;
  box-shadow:0 16px 32px rgba(0,0,0,.5);transition:transform .8s var(--ease),opacity .8s}
.tagt{font-family:var(--serif);font-size:16px;fill:#3a2a22}
.menu{font-family:var(--serif);font-size:12px;fill:#3a2a22}
/* 画放大 1.12 倍后，筷子尖落在 (44,152) 或 (196,152) */
.tipmark{position:absolute;z-index:2;top:144px;width:16px;height:16px;border:1px solid var(--brass);border-radius:50%;
  opacity:0;transition:opacity .4s .8s}
.pic.L .tipmark{left:36px}
.pic.R .tipmark{left:188px}
.pic .co{z-index:2;top:144px}
.pic.L .co{right:calc(100% + 8px)}
.pic.R .co{left:calc(100% + 8px)}
.pic .co::before{width:40px}
.pic.L .co::before{left:calc(100% + 4px)}
.pic.R .co::before{right:calc(100% + 4px)}
.torn .canvas{transform:scale(1.12);box-shadow:0 24px 48px rgba(0,0,0,.56)}
.torn .ring{transform:translateY(-48px) scale(.96);opacity:.8}
.torn .tipmark{opacity:1}

/* 展品 03：礼物，揭晓时盒盖连同吊牌掀起 */
.gift{display:block;margin-left:48px;overflow:visible}
.gift .lid{transition:transform .8s var(--ease)}
.gco{opacity:0;transition:opacity .4s 1s}
.gcot{font-family:var(--sans);font-size:12px;fill:var(--brass)}
.torn .gift .lid{transform:translateY(-40px)}
.torn .gco{opacity:1}

/* 地面：两个铜按钮、四盏连对灯、结果 */
.deck{position:absolute;left:0;right:0;bottom:0;height:var(--floor-h);padding:16px 16px calc(16px + var(--sb))}
.play{display:flex;align-items:center;justify-content:center;gap:32px;height:72px}
.btn{flex:none;width:72px;height:72px;padding:0;border:0;border-radius:50%;
  font:16px/20px var(--display);color:#3b2a14;
  background:radial-gradient(circle at 50% 32%,#f2dcaa 0,#c9a46a 48%,#8a6634 100%);
  box-shadow:0 0 0 4px #241311,0 0 0 8px rgba(var(--L),.1),0 8px 16px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.24);
  transition:transform .12s,box-shadow .3s,background .3s}
.btn:active:not(:disabled){transform:translateY(4px)}
.btn:disabled{cursor:default}
.btn.glow{background:radial-gradient(circle at 50% 40%,#fffaf0 0,#ffe7bd 44%,#e0b06a 100%);
  box-shadow:0 0 0 4px #241311,0 0 0 8px rgba(var(--L),.32),0 0 32px 8px rgba(var(--L),.5),inset 0 -4px 8px rgba(0,0,0,.12)}
.btn.miss{animation:miss .32s}
@keyframes miss{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.btn:focus-visible{outline:2px solid var(--chalk);outline-offset:8px}
.lamps{display:flex;gap:8px}
.lamps i{width:12px;height:12px;border-radius:50%;background:#2a1414;
  box-shadow:inset 0 4px 4px rgba(0,0,0,.7),0 0 0 1px rgba(var(--L),.12);transition:background .24s,box-shadow .24s}
.lamps i.on{background:#ffe7bd;box-shadow:0 0 8px 4px rgba(var(--L),.45)}
.res{margin-top:12px;height:20px;font:16px/20px var(--serif);color:var(--chalk);text-align:center}
.sub{margin-top:4px;height:20px;font:12px/20px var(--sans);color:var(--chalk-2);text-align:center}
.docent{margin:-12px 0;padding:12px 16px;border:0;background:none;font:12px/20px var(--sans);color:var(--brass);
  text-decoration:underline;text-underline-offset:4px}
.docent:focus-visible,.next:focus-visible,.ticket:focus-visible{outline:2px solid var(--brass);outline-offset:4px}
.play,.res,.sub{transition:opacity .4s}
.done{position:absolute;left:16px;right:16px;top:16px;bottom:calc(16px + var(--sb));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .6s .6s}
.room.clear .play,.room.clear .res,.room.clear .sub{opacity:0;pointer-events:none}
.room.clear .done{opacity:1;pointer-events:auto}
.done>*{flex:none}
.dk{font:12px/16px var(--sans);color:var(--brass)}
.drule{margin-top:4px;font:16px/24px var(--serif);color:var(--chalk);text-align:center;white-space:pre-line}
/* 滑动提示：文字上有一道光扫过，方向就是该滑的方向 */
.swipe{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:var(--chalk-2)}
.swipe svg{flex:none;width:16px;height:16px}
.shine{background:linear-gradient(90deg,rgba(243,231,216,.48) 0,rgba(243,231,216,.48) 40%,#fff6e0 50%,rgba(243,231,216,.48) 60%,rgba(243,231,216,.48) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
.shine.rtl{animation-name:shine-rtl}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes shine-rtl{from{background-position:0 0}to{background-position:100% 0}}
.next{margin-top:12px;height:48px;padding:0 16px;font:16px/24px var(--serif);letter-spacing:4px}

/* 前言和门票 */
.wallwash{position:absolute;top:0;left:0;right:0;height:72%;opacity:0;transition:opacity 1.2s;
  background:radial-gradient(ellipse 80% 64% at 24% 0,rgba(var(--L),.22),transparent 100%)}
.wallc{position:absolute;left:24px;right:24px;top:calc(var(--hud) + var(--st));bottom:var(--floor-h);
  display:flex;align-items:center;justify-content:center}
.intro{display:grid;grid-template-columns:auto 1fr;column-gap:24px;width:100%;max-width:480px;opacity:0;transition:opacity 1.2s .32s}
#intro.on .wallwash,#intro.on .intro{opacity:1}
.vt{margin:0;writing-mode:vertical-rl;font:400 48px/64px var(--serif);letter-spacing:16px;color:var(--chalk);
  text-shadow:0 0 32px rgba(var(--L),.3)}
.names{font:24px/32px var(--display);color:var(--chalk)}
.dates{margin-top:8px;font:16px/24px var(--display);color:var(--chalk-2)}
.pre{margin-top:24px;font:16px/28px var(--serif);color:var(--chalk-2)}
.credit{margin-top:24px;font:12px/16px var(--sans);color:var(--chalk-2)}
#intro .deck{padding-top:8px;display:flex;flex-direction:column;align-items:center}
.ticket{position:relative;display:flex;flex:none;width:100%;max-width:344px;height:112px;padding:0;border:0;
  border-radius:4px;background:var(--card);color:var(--ink);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);
  opacity:0;transition:opacity 1.2s .8s}
#intro.on .ticket{opacity:1}
.ticket::before,.ticket::after{content:"";position:absolute;right:64px;width:16px;height:16px;border-radius:50%;background:#1a0a0c}
.ticket::before{top:-8px}
.ticket::after{bottom:-8px}
.tmain{flex:1;min-width:0;padding:12px 16px;display:flex;flex-direction:column;border-right:1px dashed rgba(43,27,28,.32)}
.tt{font:12px/16px var(--sans);color:var(--brass-ink)}
.tl{margin-top:8px;font:12px/16px var(--sans);color:var(--ink-2)}
.tn{font:24px/32px var(--display);letter-spacing:4px}
.tf{font:12px/16px var(--sans);color:var(--ink-2)}
/* 票根以左下角为轴：往下撕时上端先离开，裂口从上往下走 */
.stub{flex:none;width:72px;display:flex;align-items:center;justify-content:center;border-radius:0 4px 4px 0;
  background:#e8e2d6;transform-origin:0 100%;transition:transform .32s var(--ease)}
.sv{writing-mode:vertical-rl;font:16px/24px var(--serif);letter-spacing:4px;color:var(--ink)}
#intro.on .ticket:not(.drag):not(.torn) .stub{animation:tug 4s 2.4s infinite}
@keyframes tug{0%,80%,100%{transform:none}86%{transform:rotate(6deg)}92%{transform:rotate(2deg)}}
.ticket.drag .stub{transition:none;animation:none}
.ticket.torn .stub{animation:none;transform:translate(32px,160px) rotate(56deg);opacity:0;
  transition:transform .64s cubic-bezier(.5,0,.75,0),opacity .64s .16s}
.thint{margin-top:8px;font:12px/16px var(--sans);letter-spacing:4px;transition:opacity .4s}
.ticket.torn+.thint{opacity:0}

/* 结语：一个大礼盒，点开后盒子从中间裂开，祝福卡升起，纸屑落下 */
.present{display:block;padding:0;border:0;background:none}
.present:focus-visible{outline:2px solid var(--brass);outline-offset:8px}
.bigbox{display:block;overflow:visible}
.bigbox .half,.bigbox .blid{transform-box:fill-box;transition:transform 1s var(--ease),opacity 1s}
.bigbox .half{transform-origin:50% 100%}
.bigbox .blid{transform-origin:50% 50%}
#end.lit:not(.open):not(.drag) .bigbox .blid{animation:nudge 4s 1.6s infinite}
@keyframes nudge{0%,84%,100%{transform:none}88%{transform:translateY(-4px) rotate(-2deg)}92%{transform:none}96%{transform:translateY(-4px) rotate(2deg)}}
#end.open .bigbox .blid{animation:none;transform:translateY(-96px) rotate(-16deg);opacity:0}
#end.open .bigbox .half.l{transform:translateX(-32px) rotate(-10deg);opacity:.32}
#end.open .bigbox .half.r{transform:translateX(32px) rotate(10deg);opacity:.32}
.plaque.solo{display:block;text-align:center}
.lwrap{position:absolute;left:24px;right:24px;top:calc(var(--hud) + var(--st));bottom:var(--floor-h);
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.letter{position:relative;width:100%;max-width:312px;padding:32px 24px;border-radius:4px;background:var(--card);color:var(--ink);
  box-shadow:0 24px 48px rgba(0,0,0,.5);opacity:0;transform:translateY(var(--dy,0px)) scale(.16);
  transition:transform 1.2s var(--ease) .32s,opacity .6s .32s}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,106,.6);pointer-events:none}
#end.open .letter{opacity:1;transform:none}
.letter .k{font:12px/16px var(--sans);color:var(--brass-ink)}
.letter .m{margin-top:16px;font:24px/40px var(--serif)}
.letter .s{margin-top:24px;font:16px/24px var(--serif);color:var(--ink-2);text-align:right}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#end.drag .bigbox .half,#end.drag .bigbox .blid{transition:none;animation:none}
#end .deck{display:flex;justify-content:center}
.ehint{height:48px;font:16px/24px var(--serif);letter-spacing:4px;transition:opacity .4s}
#end.open .ehint{opacity:0}

/* 固定在镜头上的顶栏 */
.hud{position:absolute;left:0;right:0;top:var(--st);height:var(--hud);padding:0 16px;z-index:2;pointer-events:none;
  display:flex;align-items:center;justify-content:space-between;font:16px/24px var(--serif);color:var(--chalk-2)}
.hud .t{transition:opacity .6s}
.hud.at-intro .t{opacity:0}
.hud .c{font-family:var(--display)}
.hud .r{display:flex;align-items:center;gap:8px}
.snd{pointer-events:auto;width:40px;height:40px;margin-right:-12px;padding:12px;border:0;background:none;color:var(--chalk-2)}
.snd svg{display:block;width:16px;height:16px}
.snd .x,.snd[aria-pressed="true"] .w{display:none}
.snd[aria-pressed="true"] .x{display:inline}
.snd:focus-visible{outline:2px solid var(--brass);outline-offset:-4px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;transition-delay:0s!important}
  .room.lit .beam,.room.lit .pool,.room.lit .spill,.room.lit .lamp::after{animation:none;opacity:1}
  .room.lit .shade{animation:none;opacity:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="dolly">
    <div id="track">
      <section class="room" id="intro">
        <div class="wallwash"></div>
        <div class="wallc">
          <div class="intro">
            <h1 class="vt">生日特展</h1>
            <div>
              <p class="names">DZC &amp; ZK</p>
              <p class="dates">展期 10.09 至 10.20</p>
              <p class="pre">上次在主厨家，饭后我们一起猜规则。这次换我们出题：三件展品各藏着一条规则，网页只说对或错，连对 4 次才能走进下一个展厅。</p>
              <p class="credit">策展：花花和佳佳</p>
            </div>
          </div>
        </div>
        <div class="deck">
          <button class="ticket" type="button" aria-label="撕下票根，入场">
            <span class="tmain">
              <span class="tt">生日特展入场券</span>
              <span class="tl">持票人</span>
              <span class="tn">DZC　ZK</span>
              <span class="tf">两人同行，饭后入场</span>
            </span>
            <span class="stub"><span class="sv">撕票入场</span></span>
          </button>

  const post = x => `<rect x="${x - 4}" y="16" width="8" height="48" fill="#a98445"/>`
    + `<rect x="${x - 4}" y="16" width="2" height="48" fill="#e3c88f"/>`
    + `<circle cx="${x}" cy="16" r="6" fill="#d9b97c"/><ellipse cx="${x}" cy="64" rx="12" ry="4" fill="#7d5c2e"/>`;
  rope.innerHTML = LEVELS.map((L, i) => `<svg${rooms[i + 1].classList.contains('lit') ? ' class="lit"' : ''} style="left:${(i + 1) * W * 1.25}px" width="${W}" height="72" viewBox="0 0 ${W} 72" aria-hidden="true">`
    + `<path d="M28 20Q${W / 2} 52 ${W - 28} 20" fill="none" stroke="#5a1720" stroke-width="6" stroke-linecap="round"/>`
    + `<path d="M28 19Q${W / 2} 49 ${W - 28} 19" fill="none" stroke="#a5414d" stroke-width="2" stroke-linecap="round" opacity=".55"/>`
    + post(24) + post(W - 24) + '</svg>').join('');
}
function setW() {
  W = innerWidth;
  document.documentElement.style.setProperty('--W', W + 'px');
  buildRope(); setCam(pos);
}
function hudSet() {
  hud.classList.toggle('at-intro', cur === 0);
  hudC.textContent = cur === 0 ? '前言' : cur === rooms.length - 1 ? '结语' : `0${cur} / 0${LEVELS.length}`;
}
async function moveTo(to, ease) {
  await tween(to, Math.max(480, 1800 * Math.abs(to - pos)), ease || EASE.io);
  cur = to; setCam(to); hudSet();
}
// 镜头往下一个展厅探一下头再回来，告诉人可以往左滑
async function peek() {
  if (moving || reduce || G) return;
  const base = cur;
  if (await tween(base + .1, 360, EASE.out)) await tween(base, 480, EASE.io);
}

// 关卡
function prepare(i) {
  const room = rooms[i + 1], q = s => room.querySelector(s);
  S = { i, L: LEVELS[i], room, piece: q('.piece'), btns: [...room.querySelectorAll('.btn')],
        lampsEl: q('.lamps'), lamps: [...room.querySelectorAll('.lamps i')], res: q('.res'), hint: q('.hint'),
        docent: q('.docent'), dk: q('.dk'), drule: q('.drule'), next: q('.next'),
        item: first[i], keys: [first[i].key], hist: [], streak: 0, wrong: 0, hintOpen: false, busy: true, done: false, timer: 0 };
  S.btns.forEach((b, k) => { b.onclick = () => answer(k); });
  S.docent.onclick = onDocent;
  // 下一个展厅靠往左滑；轻点只演示一下，键盘回车直接走
  S.next.onclick = e => {
    if (moving || performance.now() - justDragged < 400) return;
    if (e.detail === 0) go(i + 1); else peek();
  };
}
const setBtns = on => S.btns.forEach(b => { b.disabled = !on; });

// 走进下一个展厅：镜头停稳后开灯，离开的展厅关灯；隔离带跟着本展厅的灯一起亮
function lights(r, on) {
  rooms[r].classList.toggle('lit', on);
  const seg = rope.children[r - 1];
  if (seg) seg.classList.toggle('lit', on);
}
async function go(next, fromDrag) {
  if (moving) return;
  moving = true;
  const target = next < LEVELS.length ? next + 1 : rooms.length - 1;
  if (next < LEVELS.length) prepare(next);
  const prev = cur;
  await moveTo(target, fromDrag ? EASE.out : EASE.io);
  lights(prev, false);
  lights(target, true);
  moving = false;
  if (next < LEVELS.length) {
    await wait(reduce ? 0 : 720);
    S.busy = false; setBtns(true);
  }
}
function answer(k) {
  if (S.busy || S.done) return;
  S.busy = true; setBtns(false);
  const ok = k === S.item.ans, right = S.btns[S.item.ans];
  S.hist.push(S.item.ans);
  if (ok) S.streak++; else { S.streak = 0; S.wrong++; S.btns[k].classList.add('miss'); }
  right.classList.add('glow');
  S.lamps.forEach((l, j) => l.classList.toggle('on', j < S.streak));
  S.lampsEl.setAttribute('aria-label', `连对 ${S.streak} 次`);
  S.res.textContent = ok ? '对。' : `不对，是「${S.L.opts[S.item.ans]}」。`;
  subSet();
  if (S.streak >= STREAK) { S.timer = setTimeout(() => clear(false), 720); return; }
  S.timer = setTimeout(async () => {
    S.btns.forEach(b => b.classList.remove('glow', 'miss'));
    S.item = gen(S.L, S.hist, S.keys); S.keys.push(S.item.key);
    S.res.textContent = '';
    await show(S.piece, S.L, S.item);
    if (S.done) return;
    S.busy = false; setBtns(true);
  }, ok ? 960 : 1440);
}
// 讲解员：错满 6 次给提示，错满 12 次可以请他直接揭晓，保证一定走得到结语
function subSet() {
  const d = S.docent;
  if (S.wrong >= REVEAL_AT) { d.textContent = '请讲解员揭晓'; d.hidden = false; S.hint.hidden = true; }
  else if (S.wrong >= HINT_AT && !S.hintOpen) { d.textContent = '问讲解员'; d.hidden = false; S.hint.hidden = true; }
  else { d.hidden = true; S.hint.hidden = false; }
}
function onDocent() {
  if (S.done) return;
  if (S.wrong >= REVEAL_AT) { clear(true); return; }
  S.hintOpen = true; S.hint.textContent = S.L.hint; subSet();
}
function clear(byDocent) {
  clearTimeout(S.timer);
  S.done = true; S.busy = true; setBtns(false);
  S.btns.forEach(b => b.classList.remove('glow', 'miss'));
  S.lamps.forEach(l => l.classList.add('on'));
  S.dk.textContent = byDocent ? '讲解员揭晓了' : '看穿了';
  S.drule.textContent = S.L.rule;
  S.room.classList.add('torn', 'clear');
  const me = S;
  setTimeout(() => { if (S === me && !moving) peek(); }, 2400);
}

// 八音盒生日歌：网页现场合成，撕票和拆礼盒时各响一遍；右上角可以静音
const snd = $('.snd');
let actx = null, master = null, muted = false;
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) {
    actx = new AC();
    master = actx.createGain(); master.gain.value = muted ? 0 : .4;
    const echo = actx.createDelay(), fb = actx.createGain(), tone = actx.createBiquadFilter();
    echo.delayTime.value = .24; fb.gain.value = .25; tone.type = 'lowpass'; tone.frequency.value = 2600;
    master.connect(actx.destination);
    master.connect(echo); echo.connect(tone); tone.connect(fb); fb.connect(echo); tone.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const NOTE = { G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98 };
const SONG = ('G5 .75,G5 .25,A5 1,G5 1,C6 1,B5 2,G5 .75,G5 .25,A5 1,G5 1,D6 1,C6 2,'
  + 'G5 .75,G5 .25,G6 1,E6 1,C6 1,B5 1,A5 2,F6 .75,F6 .25,E6 1,C6 1,D6 1,C6 3').split(',').map(s => s.split(' '));
function pluck(t, f, v) {
  [[1, .5], [2, .14], [3, .05]].forEach(([m, g]) => {
    const o = actx.createOscillator(), e = actx.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    e.gain.setValueAtTime(0, t);
    e.gain.linearRampToValueAtTime(g * v, t + .006);
    e.gain.exponentialRampToValueAtTime(.0001, t + 1.6 / m);
    o.connect(e); e.connect(master); o.start(t); o.stop(t + 1.7);
  });
}
function playSong(sparkle) {
  if (!audio()) return;
  let t = actx.currentTime + .08;
  if (sparkle) {
    ['C6', 'E6', 'G6'].forEach((n, i) => pluck(t + i * .07, NOTE[n], .5));
    pluck(t + .21, NOTE.C6 * 2, .45);
    t += .9;
  }
  SONG.forEach(([n, d]) => { pluck(t, NOTE[n], .9); t += d * .5; });
}
snd.onclick = () => {
  muted = !muted;
  snd.setAttribute('aria-pressed', String(muted));
  if (master) master.gain.setTargetAtTime(muted ? 0 : .4, actx.currentTime, .05);
};

// iPhone 上要有触摸监听，按下时的 :active 样式才会出现；声音要在手势里才放得出来
document.addEventListener('touchstart', () => {}, { passive: true });
['touchend', 'click'].forEach(t => document.addEventListener(t, () => {
  if (actx && actx.state !== 'running') actx.resume();
}, { passive: true }));

// 门票：撕下票根，镜头出发
const stub = ticket.querySelector('.stub');
function tear() {
  if (ticket.classList.contains('torn')) return;
  ticket.classList.add('torn');
  playSong(false);
  setTimeout(() => go(0), reduce ? 0 : 640);
}
ticket.addEventListener('click', e => {
  if (ticket.classList.contains('torn') || performance.now() - justDragged < 400) return;
  if (e.detail === 0) { tear(); return; }
  if (!reduce && stub.animate) stub.animate([{ transform: 'none' }, { transform: 'translateX(4px) rotate(10deg)' }, { transform: 'none' }], { duration: 560, easing: 'ease-in-out' });
});

// 结语：拆礼盒。祝福卡从盒子的位置升到墙中间，纸屑一部分从盒口炸开、一部分从光里落下
const endRoom = rooms[rooms.length - 1], present = endRoom.querySelector('.present'),
      letter = endRoom.querySelector('.letter'), cv = endRoom.querySelector('.confetti'),
      lid = endRoom.querySelector('.blid'), halves = [...endRoom.querySelectorAll('.half')];
function openGift() {
  if (endRoom.classList.contains('open')) return;
  const b = present.getBoundingClientRect(), c = letter.getBoundingClientRect();
  letter.style.transition = 'none';
  letter.style.setProperty('--dy', `${Math.round(b.top + b.height / 2 - (c.top + c.height / 2))}px`);
  letter.getBoundingClientRect();
  letter.style.transition = '';
  endRoom.classList.add('open');
  present.disabled = true;
  playSong(true);
  confetti(b);
}
present.addEventListener('click', e => {
  if (endRoom.classList.contains('open') || performance.now() - justDragged < 400) return;
  if (e.detail === 0) { openGift(); return; }
  if (!reduce && lid.animate) lid.animate([{ transform: 'none' }, { transform: 'translateY(-20px) rotate(-4deg)' }, { transform: 'none' }], { duration: 560, easing: 'ease-out' });
});

// 滑动：撕票、去下一个展厅、掀盒盖。手指移动超过 8px 才算拖，跟着手实时变；
// 松手时过了线（或甩得够快）就完成，没过线就弹回。p 是拖动进度，1 是到线
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let G = null, justDragged = 0;
const DRAG = {
  ticket: {
    move(dx, dy) {
      const p = clamp(Math.max(dx, dy) / 96, 0, 1.2);
      stub.style.transform = `translateX(${p * 8}px) rotate(${p * 20}deg)`;
      return p;
    },
    end(g) {
      ticket.classList.remove('drag'); stub.style.transform = '';
      if (g.p >= .8 || (g.p > .3 && Math.max(g.vx, g.vy) > .6)) tear();
    }
  },
  walk: {
    move(dx) {
      let p = -dx / W;
      if (p < 0) p *= .2;
      p = Math.min(p, 1);
      setCam(cur + p);
      return p;
    },
    end(g) {
      if (g.p >= .28 || (g.p > .06 && g.vx < -.5)) go(S.i + 1, true); else tween(cur, 360, EASE.out);
    }
  },
  gift: {
    move(dx, dy) {
      const p = clamp(-dy / 120, 0, 1.2);
      lid.style.transform = `translateY(${-p * 64}px) rotate(${-p * 6}deg)`;
      halves[0].style.transform = `translateX(${-p * 8}px) rotate(${-p * 2}deg)`;
      halves[1].style.transform = `translateX(${p * 8}px) rotate(${p * 2}deg)`;
      return p;
    },
    end(g) {
      endRoom.classList.remove('drag');
      [lid, ...halves].forEach(el => { el.style.transform = ''; });
      if (g.p >= .6 || (g.p > .2 && g.vy < -.6)) openGift();
    }
  }
};
function dragMode(target) {
  if (moving) return null;
  if (cur === 0) return intro.classList.contains('on') && !ticket.classList.contains('torn') && target.closest('.ticket, .thint') ? 'ticket' : null;
  if (S && S.done && cur === S.i + 1) return 'walk';
  if (cur === rooms.length - 1 && endRoom.classList.contains('lit') && !endRoom.classList.contains('open')) return 'gift';
  return null;
}
const app = $('#app');
app.addEventListener('pointerdown', e => {
  if (G || (e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.snd')) return;
  const mode = dragMode(e.target);
  if (!mode) return;
  if (mode !== 'walk') audio();
  G = { mode, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: e.timeStamp, vx: 0, vy: 0, moved: false, p: 0 };
});
app.addEventListener('pointermove', e => {
  if (!G || e.pointerId !== G.id) return;
  const dt = Math.max(1, e.timeStamp - G.t);
  G.vx = .6 * G.vx + .4 * (e.clientX - G.x) / dt;
  G.vy = .6 * G.vy + .4 * (e.clientY - G.y) / dt;
  G.x = e.clientX; G.y = e.clientY; G.t = e.timeStamp;
  const dx = G.x - G.x0, dy = G.y - G.y0;
  if (!G.moved) {
    if (Math.hypot(dx, dy) < 8) return;
    G.moved = true; ++camTok;
    if (G.mode === 'ticket') ticket.classList.add('drag');
    if (G.mode === 'gift') endRoom.classList.add('drag');
    try { app.setPointerCapture(G.id); } catch (_) {}
  }
  G.p = DRAG[G.mode].move(dx, dy);
});
function release(e, cancel) {
  if (!G || e.pointerId !== G.id) return;
  const g = G; G = null;
  if (!g.moved) return;
  justDragged = performance.now();
  if (cancel) g.p = 0;
  if (e.timeStamp - g.t > 80) { g.vx = 0; g.vy = 0; }
  DRAG[g.mode].end(g);
}
app.addEventListener('pointerup', e => release(e, false));
app.addEventListener('pointercancel', e => release(e, true));
function confetti(box) {
  if (reduce || !cv.getContext) return;
  const room = endRoom.getBoundingClientRect(), w = room.width, h = room.height, dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const COLORS = ['#c9a46a', '#f2dcaa', '#f2efe9', '#e3b47c', '#a5414d', '#fff6e0'];
  const ox = box.left - room.left + box.width / 2, oy = box.top - room.top + 48, P = [];
  const add = (x, y, vx, vy) => P.push({ x, y, vx, vy, w: 4 + Math.random() * 4, h: 8 + Math.random() * 4, r: Math.random() * 6.28,
    vr: (Math.random() - .5) * .3, ph: Math.random() * 6.28, cap: 2 + Math.random() * 1.6, c: COLORS[Math.floor(Math.random() * COLORS.length)] });
  for (let i = 0; i < 90; i++) add(ox + (Math.random() - .5) * 48, oy, (Math.random() - .5) * 8, -5 - Math.random() * 5);
  for (let i = 0; i < 70; i++) add(w / 2 + (Math.random() - .5) * Math.min(w, 400), -16 - Math.random() * h * .5, (Math.random() - .5), 1 + Math.random());
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0, a = el > 4200 ? Math.max(0, 1 - (el - 4200) / 1200) : 1;
    ctx.clearRect(0, 0, w, h);
    P.forEach(p => {
      p.vy = Math.min(p.vy + .18, p.cap); p.vx *= .985;
      p.x += p.vx + Math.sin(t / 400 + p.ph) * .6; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(t / 180 + p.ph));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (el < 5400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
  })(t0);
}

setW(); hudSet();
requestAnimationFrame(() => setTimeout(() => intro.classList.add('on'), 80));
addEventListener('resize', setW);
})();
</script>
</body>
